[pytest]
testpaths = tests
# The default run is offline and free: no ZMQ server, no network, no LLM
# requests, no model downloads. Opt in explicitly with -m integration / llm / slow.
addopts = -q -m "not integration and not llm and not slow" -p no:launch_testing
markers =
    integration: needs a live GraspGen-X server
    llm: spends free-tier LLM requests
    slow: downloads model weights or is otherwise slow
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
